apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaleplex-orchestrator
  namespace: scaleplex
---
apiVersion: v1
kind: Service
metadata:
  name: scaleplex-orchestrator
  namespace: scaleplex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scaleplex-orchestrator
  ports:
    - name: http
      port: 3500
      targetPort: 3500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaleplex-orchestrator
  namespace: scaleplex
  labels:
    app.kubernetes.io/name: scaleplex-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaleplex-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaleplex-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3500"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scaleplex-orchestrator
      terminationGracePeriodSeconds: 10
      containers:
        - name: orchestrator
          image: ghcr.io/varashi/scaleplex_orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3500
          env:
            - name: LISTEN_ADDR
              value: ":3500"
            - name: WORKERS_DNS
              value: "scaleplex-worker.scaleplex.svc.cluster.local"
            - name: WORKER_PORT
              value: "3501"
            - name: WORKERS_REFRESH_SECONDS
              value: "5"
            - name: WORKERS_PROBE_SECONDS
              value: "5"
            # Scheduling (heterogeneous fleet). PREFER_HW=1 tiers HW-capable
            # workers ahead of CPU-only ones; LB_STRATEGY orders within a tier:
            # load (default) | round-robin | least-sessions | random.
            - name: SCALEPLEX_PREFER_HW
              value: "1"
            - name: SCALEPLEX_LB_STRATEGY
              value: "load"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
