language: en-US
tone_instructions: "Terse, technical, fragments OK. Skip pleasantries. Go idioms over generic advice."
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  changed_files_summary: true
  sequence_diagrams: false

  path_filters:
    - "!docs/**"
    - "!**/*.md"
    - "!CHANGELOG*"
    - "!**/testdata/**"
    - "!scaleplex-ffmpeg/**"
    - "!charts/**/templates/**"
    - "!**/*.pb.go"
    - "!**/mock_*.go"
    - "!**/*_mock.go"
    - "!**/go.sum"
    - "!**/renovate.json"

  path_instructions:
    - path: "worker/**/*.go"
      instructions: |
        Transcoding worker. Flag: goroutine leaks, unbuffered channels in hot paths, ffmpeg argv mutation races,
        missing context cancellation, ignored errors from io.Copy/Wait. Watch for Plex argv-rewriter correctness:
        SRT/PGS overlay branches, seekOff shifts, dovi_rpu passthrough. Suggest table-driven tests for argv shapes.
    - path: "orchestrator/**/*.go"
      instructions: |
        Session router. Flag: stale worker entries, unbounded retry loops, HTTP handler missing timeout,
        sync.Map misuse. Concurrency invariants must hold under worker churn.
    - path: "cmd/argv-extract/**"
      instructions: |
        Corpus capture utility. Don't suggest renaming flags — call sites in worker depend on them.
    - path: "**/*_test.go"
      instructions: |
        Replay tests (replay_test.go) validate rewriter against argv corpus. Flag missing FAIL-argv coverage
        when adding rewriter branches.
    - path: "charts/**/values.yaml"
      instructions: |
        Helm defaults. Check tag/image pinning; avoid latest.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "[skip-review]"
    drafts: false
    base_branches:
      - "main"
    ignore_usernames:
      - "renovate[bot]"
      - "github-actions[bot]"

  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
