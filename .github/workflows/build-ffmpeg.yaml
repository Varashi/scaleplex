name: build-ffmpeg

# Builds scaleplex-ffmpeg7 = jellyfin-ffmpeg + our patches into a deb
# artifact. Uses the prebuilt deps base image
# (ghcr.io/varashi/scaleplex-ffmpeg-deps:<jellyfin-tag>) so per-iteration
# rebuilds skip the ~25-40 min bundled-deps compile and only do the
# ffmpeg link + dpkg-buildpackage (~5-10 min).
#
# The deps image is rebuilt by .github/workflows/build-ffmpeg-deps.yaml
# whenever scaleplex-ffmpeg/VERSION (pinned jellyfin tag) changes. If
# the deps tag for the current VERSION is missing from GHCR, this build
# fails fast with a clear error — manually run build-ffmpeg-deps first.
#
# Output deb is published as a tiny FROM-scratch OCI image,
# ghcr.io/varashi/scaleplex-ffmpeg-deb:<key>, where <key> is a hash of
# the committed build inputs under scaleplex-ffmpeg/ (deb-key.sh; docs
# excluded). Same inputs → same tag, so the build is skipped when the image
# already exists and build-worker can look the deb up by content instead
# of by "latest successful run" (workflow artifacts expire; #211).
# PR runs build the deb but don't push; they upload a short-lived
# artifact for inspection only.

on:
  push:
    branches: [main]
    paths:
      - "scaleplex-ffmpeg/**"
      - "!scaleplex-ffmpeg/**/*.md"
      - ".github/workflows/build-ffmpeg.yaml"
  pull_request:
    paths:
      - "scaleplex-ffmpeg/**"
      - "!scaleplex-ffmpeg/**/*.md"
      - ".github/workflows/build-ffmpeg.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ffmpeg-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEB_IMAGE: ghcr.io/varashi/scaleplex-ffmpeg-deb

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # write only matters on push/dispatch (publishing the deb image);
      # PR runs never push.
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        # Pulls the private deps base image; on push/dispatch also
        # publishes the deb image.
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve deb image tag
        id: tag
        run: |
          set -euo pipefail
          tree=$(./scaleplex-ffmpeg/deb-key.sh)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] && \
             docker manifest inspect "$DEB_IMAGE:$tree" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$DEB_IMAGE:$tree already published; skipping deb build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: free runner disk
        if: steps.tag.outputs.exists != 'true'
        # Per-iteration build no longer needs the giant transient — deps
        # are pre-baked into the FROM base. Still drop preinstalled junk
        # to keep headroom for the deb build + artifact upload.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          df -h
      - name: build deb
        if: steps.tag.outputs.exists != 'true'
        env:
          BUILDX: "1"
        run: ./scaleplex-ffmpeg/build.sh
      - name: list output
        if: steps.tag.outputs.exists != 'true'
        run: ls -lh scaleplex-ffmpeg/dist/
      - name: publish deb image
        if: steps.tag.outputs.exists != 'true' && github.event_name != 'pull_request'
        env:
          TREE: ${{ steps.tag.outputs.tree }}
        run: |
          set -euo pipefail
          printf 'FROM scratch\nCOPY scaleplex-ffmpeg7_*.deb /\n' | \
            docker buildx build --push -f - \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              --label org.opencontainers.image.description="scaleplex-ffmpeg7 deb (tree $TREE)" \
              -t "$DEB_IMAGE:$TREE" scaleplex-ffmpeg/dist
          echo "::notice::published $DEB_IMAGE:$TREE"
      - uses: actions/upload-artifact@v7
        # PR-only inspection copy; nothing consumes it.
        if: github.event_name == 'pull_request'
        with:
          name: scaleplex-ffmpeg7-deb
          path: scaleplex-ffmpeg/dist/*.deb
          if-no-files-found: error
          retention-days: 7
