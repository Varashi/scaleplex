name: build-worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "scaleplex-ffmpeg/**"
      - ".github/workflows/build-worker.yaml"
  pull_request:
    paths:
      - "worker/**"
      - "scaleplex-ffmpeg/**"
  workflow_run:
    # Rebuild the worker image whenever a fresh ffmpeg deb is published.
    workflows: [build-ffmpeg]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  go-build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: worker/agent/go.sum
      - name: vet
        working-directory: worker/agent
        run: go vet ./...
      - name: build
        working-directory: worker/agent
        run: go build ./...

  image:
    needs: go-build-test
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: fetch scaleplex-ffmpeg deb
        # The worker Dockerfile expects scaleplex-ffmpeg/dist/*.deb at
        # build context root. Pull the latest successful build-ffmpeg
        # artifact via the gh CLI (cross-workflow, in-repo, no third
        # party action). Falls back to running the deb build inline if
        # no artifact is available (first ever run, or build-ffmpeg has
        # not been triggered yet on this branch).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scaleplex-ffmpeg/dist
          run_id=$(gh run list \
            --workflow=build-ffmpeg.yaml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId' || true)
          if [[ -n "${run_id:-}" ]]; then
            echo "downloading scaleplex-ffmpeg7-deb from run $run_id"
            gh run download "$run_id" \
              --name scaleplex-ffmpeg7-deb \
              --dir scaleplex-ffmpeg/dist
          else
            echo "no successful build-ffmpeg run yet; building inline"
            ./scaleplex-ffmpeg/build.sh
          fi
          ls -lh scaleplex-ffmpeg/dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/varashi/scaleplex_worker
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
