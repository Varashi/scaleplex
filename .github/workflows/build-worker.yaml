name: build-worker

on:
  push:
    branches: [main]
    # scaleplex-ffmpeg/** deliberately NOT listed: an ffmpeg change
    # reaches the worker via workflow_run once build-ffmpeg has
    # published the new deb image. Listing it here raced build-ffmpeg
    # and built the worker against the previous deb (#211).
    paths:
      - "worker/**"
      - ".github/workflows/build-worker.yaml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/build-worker.yaml"
  workflow_run:
    # Rebuild the worker image whenever a fresh ffmpeg deb is published.
    workflows: [build-ffmpeg]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEB_IMAGE: ghcr.io/varashi/scaleplex-ffmpeg-deb
  # workflow_run's github.sha is default-branch HEAD, not the commit
  # build-ffmpeg ran on; build exactly that commit instead.
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  go-build-test:
    runs-on: ubuntu-24.04
    # A failed build-ffmpeg run must not trigger a worker rebuild.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: worker/agent/go.sum
      - name: vet
        working-directory: worker/agent
        run: go vet ./...
      - name: test
        working-directory: worker/agent
        run: go test -cover ./...
      - name: replay (rewriter-only, fixture corpus)
        # Build-tagged replay tests against the committed
        # worker/agent/testdata/replay-corpus/ fixture (240 stratified
        # synthetic Optimize cells). REPLAY_NO_FFMPEG=1 skips the
        # in-pod ffmpeg spawn — catches rewriter regressions in PR CI
        # without needing the cluster or the live corpus. In-pod
        # replay against plex-test remains a pre-tag step (see
        # docs/RELEASE_GATE.md T2).
        working-directory: worker/agent
        env:
          REPLAY_CORPUS_DIR: ${{ github.workspace }}/worker/agent/testdata/replay-corpus
          REPLAY_NO_FFMPEG: "1"
        run: go test -tags=replay -run TestReplayCorpus ./...
      - name: build
        working-directory: worker/agent
        run: go build ./...

  image:
    needs: go-build-test
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        # Before the deb fetch: both the deb image and the inline
        # fallback's deps base image are private GHCR packages.
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: fetch scaleplex-ffmpeg deb
        # The worker Dockerfile expects scaleplex-ffmpeg/dist/*.deb in
        # the build context. build-ffmpeg publishes it as
        # $DEB_IMAGE:<scaleplex-ffmpeg/deb-key.sh>, so the deb is
        # looked up by content — no dependency on expiring workflow
        # artifacts (#211).
        id: deb
        run: |
          set -euo pipefail
          mkdir -p scaleplex-ffmpeg/dist
          tree=$(./scaleplex-ffmpeg/deb-key.sh)
          img="$DEB_IMAGE:$tree"
          if docker pull -q "$img" >/dev/null 2>&1; then
            cid=$(docker create "$img" /nonexistent)
            docker export "$cid" | tar -x -C scaleplex-ffmpeg/dist --wildcards 'scaleplex-ffmpeg7_*.deb'
            docker rm -f "$cid" >/dev/null
            echo "using $img"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Only happens when this push also changed scaleplex-ffmpeg/:
            # build-ffmpeg is publishing the new deb and its completion
            # re-triggers this workflow via workflow_run.
            echo "::notice::$img not published yet; worker build deferred to the build-ffmpeg workflow_run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::warning::$img not found; building the deb inline"
            ./scaleplex-ffmpeg/build.sh
          fi
          ls -lh scaleplex-ffmpeg/dist/
      - name: short sha
        if: steps.deb.outputs.skip != 'true'
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: meta
        if: steps.deb.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/varashi/scaleplex_worker
          # sha- tag from the commit actually built (BUILD_SHA), not
          # github.sha, which is default-branch HEAD on workflow_run.
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        if: steps.deb.outputs.skip != 'true'
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
