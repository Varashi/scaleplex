<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
Slim fontconfig for the scaleplex worker. Restricts libass + fontconfig
font search to the DejaVu + Noto Sans dirs (~14 + ~30 files) instead of
the system corpus (~200+). Cuts libass first-frame fontselect from
~700ms to <80ms on the worker. Mirrors Plex's strategy of shipping a
private fonts.conf pointing at a narrow set of dirs.

DejaVu is the rewriter's default fallback (force_style='FontName=DejaVu
Sans' historically; fork patch 0099 default). Noto Sans is what PMS
emits in its `inlineass=...:overrides=FontName=Noto Sans Medium...`
arg — having it locally means libass renders force-burn subs in the
same face stock Plex would (no scrub-induced fallback to DejaVu).

Cachedirs in priority order: per-user (built at image build time as
uid 1000) then system. Both are made writable to uid:1000 in the
Dockerfile so libass can grow the cache on demand without printing
the noisy "No writable cache directories" warning (which on `-loglevel
quiet` becomes the only visible stderr and was easily mistaken for the
fatal exit-145 cause on the 2026-05-31 Ghosts force-burn diag).
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir>/home/ubuntu/.cache/fontconfig</cachedir>
  <cachedir>/var/cache/fontconfig</cachedir>

  <!-- PMS emits `inlineass=...:overrides=FontName=Noto Sans Medium...`.
       Ubuntu's fonts-noto-core only ships Regular/Bold/Italic weights —
       no Medium .ttf. Alias the Medium request to Regular (same family,
       one weight thinner) instead of letting fontconfig fall through to
       DejaVu. Closes the visual gap to stock Plex burns without
       paying the 334 MB of fonts-noto-extra. -->
  <alias binding="strong">
    <family>Noto Sans Medium</family>
    <accept>
      <family>Noto Sans</family>
    </accept>
  </alias>
</fontconfig>
