<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
Slim fontconfig for the scaleplex worker. Restricts libass + fontconfig
font search to the DejaVu dir only (~14 files) instead of the system
corpus. Cuts libass first-frame fontselect from ~700ms to <50ms on the
worker. Mirrors Plex's strategy of shipping a private fonts.conf
pointing at one dir and nothing else.

Cachedirs in priority order: per-user (built at image build time as
uid 1000) then system. The rewriter sets HOME=/home/ubuntu in the
spawned ffmpeg env so libass finds the per-user cache.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>/home/ubuntu/.cache/fontconfig</cachedir>
  <cachedir>/var/cache/fontconfig</cachedir>
</fontconfig>
