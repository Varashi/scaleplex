# scaleplex single-host all-in-one Docker Compose — NVIDIA NVENC variant.
#
# Sister of ./compose.yaml (Intel iHD VAAPI). Brings up orchestrator +
# 1 worker on one host with the NVIDIA-built worker image. Requires
# the host to have nvidia-container-toolkit installed + a recent
# NVIDIA driver (>=550 for ffmpeg-7's NVENC/NVDEC paths).
#
# For multi-host (orchestrator on one host, NVIDIA workers on another),
# use the same patterns as the VAAPI multi-host.md: WORKERS_LIST or
# PUSH discovery (v1.8.0+). Cross-backend fleets — VAAPI workers and
# NVIDIA workers in the same orchestrator — are NOT supported in Phase
# 1; orchestrator routing assumes all workers share a backend.
#
# Security posture: LAN-only, HTTP plaintext. Wrap in Caddy/Traefik
# for auth/TLS.

services:
  orchestrator:
    image: ghcr.io/varashi/scaleplex_orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_PORT:-3500}:3500"
    environment:
      LISTEN_ADDR: ":3500"
      WORKERS_DNS: worker
      WORKER_PORT: "3501"
      WORKERS_LIST: "${WORKERS_LIST:-}"
      WORKERS_REFRESH_SECONDS: "5"
      WORKERS_PROBE_SECONDS: "5"
      WORKERS_PUSH_REAP_SECONDS: "5"
      WORKERS_PUSH_TIMEOUT_SECONDS: "15"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3500/readyz"]
      interval: 5s
      timeout: 2s
      retries: 30
    networks:
      - scaleplex_net

  worker:
    # NOTE: Phase 1 ships the NVIDIA worker as a sibling image. Until
    # the CI matrix lands (PR #3 of the dialect rollout), this tag
    # tracks the feat/nvidia-dialect branch builds. Once merged + the
    # image build job is plumbed, this becomes:
    #   ghcr.io/varashi/scaleplex_worker_nvidia:${IMAGE_TAG:-latest}
    image: ghcr.io/varashi/scaleplex_worker_nvidia:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # GPU passthrough via nvidia-container-toolkit. Two equivalent forms
    # — pick whichever your runtime supports. CDI (newer) is preferred:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
      # Force HW re-acceleration even on Plex SW argv. Phase 1 prod
      # default = 1 on the homogeneous NVIDIA fleet. Set to 0 for
      # heterogeneous / honor-Plex behavior.
      SCALEPLEX_FORCE_HW: "${SCALEPLEX_FORCE_HW:-1}"
      # WORKER_BACKEND=nvidia is the image default; uncomment to override.
      # WORKER_BACKEND: "nvidia"
      WORKER_MAX_SESSIONS: "${WORKER_MAX_SESSIONS:-0}"
      # Tonemap algorithm — Plex's argv carries this when its
      # TranscoderToneMapping pref is on. SCALEPLEX_TONEMAP_ALGO is the
      # fallback when Plex's chain didn't carry one (SW HDR reshape).
      # Valid: hable | mobius | reinhard | bt2390 | linear | gamma | clip.
      # SCALEPLEX_TONEMAP_ALGO: "${SCALEPLEX_TONEMAP_ALGO:-hable}"
    # NVIDIA worker doesn't bind /dev/dri/renderD* (that's iHD). The
    # CDI spec handles /dev/nvidia* nodes at runtime. user/group_add
    # match the VAAPI compose for parity.
    user: "1000:100"
    group_add:
      - "44"
    # WSL host: nvidia-container-toolkit 1.19 CDI spec omits
    # libnvidia-encode / libnvidia-decode (cuvid) / libnvidia-opticalflow.
    # NVENC/NVDEC fail to open without them. Workaround = manual bind
    # from /usr/lib/wsl/lib/. Uncomment + adjust on a WSL host:
    # volumes:
    #   - "/usr/lib/wsl/lib/libnvidia-encode.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-encode.so.1:ro"
    #   - "/usr/lib/wsl/lib/libnvcuvid.so.1:/usr/lib/x86_64-linux-gnu/libnvcuvid.so.1:ro"
    #   - "/usr/lib/wsl/lib/libnvidia-opticalflow.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-opticalflow.so.1:ro"
    volumes:
      - "${MEDIA_DIR:-./media}:/media:ro"
      - "${TRANSCODE_DIR:-./transcode}:/transcode"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3501/readyz"]
      interval: 5s
      timeout: 2s
      # CUDA + NVENC JIT init can take 30-60s on cold start.
      retries: 60
    networks:
      - scaleplex_net

networks:
  scaleplex_net:
    driver: bridge
